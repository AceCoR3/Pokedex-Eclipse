<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eclipse Font-Test</title><style>@font-face{font-family:PokemonPixel;src:url('./font/pokemon_pixel_font.ttf') format('truetype');font-display:block}body{background:#09090f;color:white;font:16px Arial;padding:28px;max-width:850px;margin:auto}h1{color:#c4a8ff}.pixel{font:32px PokemonPixel,monospace;line-height:1.7}.normal{font:32px Arial,sans-serif}.panel{border:1px solid #56476d;border-radius:14px;padding:22px;margin:18px 0}#status{color:#c4a8ff}small{color:#aaa}</style></head><body><h1>Pokédex Eclipse – Schriftprüfung</h1><p id="status">Prüfe die Schriftdatei ...</p><div class="panel"><small>HOCHGELADENE POKÉMON-PIXEL-FONT</small><p class="pixel">PIKACHU GLURAK GENGAR<br>0123456789 ABCDEFG</p></div><div class="panel"><small>STANDARD-SCHRIFT ZUM VERGLEICH</small><p class="normal">PIKACHU GLURAK GENGAR<br>0123456789 ABCDEFG</p></div><p>Hinweis: Die hochgeladene Font hat keine Glyphen für ä, ö, ü, ß oder é.</p><script>const url='./font/pokemon_pixel_font.ttf';fetch(url).then(async r=>{if(!r.ok)throw Error('HTTP '+r.status);const bytes=await r.arrayBuffer();const f=new FontFace('EclipseTest',bytes);await f.load();document.fonts.add(f);document.getElementById('status').textContent='✓ Schriftdatei geladen ('+bytes.byteLength+' Bytes).';}).catch(e=>document.getElementById('status').textContent='✕ Schrift konnte nicht geladen werden: '+e.message)</script></body></html>
